services:
  haf:
    # Skip hived since cached data is already replayed (same as balance_tracker)
    command: ["--skip-hived"]
    environment:
      PGCTLTIMEOUT: 600
      PG_ACCESS: "
        host    all    all    all    trust\n
        "
    ports:
      - 5432:5432
    # Keep blockchain bind mount - provides dereferenced files from docker/blockchain
    # (symlinks in datadir/blockchain point to /blockchain which isn't accessible in DinD)
    volumes:
      - haf_datadir:/home/hived/datadir
      - haf_shmdir:/home/hived/shm_dir
      - ./scripts/haf-healthcheck.sh:/home/hived/healthcheck.sh
      - ./blockchain:/home/hived/datadir/blockchain

volumes:
  haf_datadir:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${HAF_DATA_DIRECTORY}/
  haf_shmdir:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${HAF_SHM_DIRECTORY}/

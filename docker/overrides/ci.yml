services:
  haf:
    # Skip hived since cached data is already replayed (same as balance_tracker)
    command: ["--skip-hived"]
    environment:
      PGCTLTIMEOUT: 600
      PG_ACCESS: "
        host    all    all    all    trust\n
        "
    ports:
      - 5432:5432
    # Keep blockchain bind mount - provides dereferenced files from docker/blockchain
    # (symlinks in datadir/blockchain point to /blockchain which isn't accessible in DinD)
    volumes:
      - haf_datadir:/home/hived/datadir
      - haf_shmdir:/home/hived/shm_dir
      - ./scripts/haf-healthcheck.sh:/home/hived/healthcheck.sh
      - ./blockchain:/home/hived/datadir/blockchain

  # CI-specific volume mounts for app-setup
  # Docker image doesn't contain submodules (GIT_SUBMODULE_STRATEGY: none in build)
  # Mount submodules from host for install scripts
  app-setup:
    volumes:
      - ../submodules/hafah:/home/haf_admin/haf_block_explorer/submodules/hafah
      - ../submodules/btracker:/home/haf_admin/haf_block_explorer/submodules/btracker
      - ../submodules/reptracker:/home/haf_admin/haf_block_explorer/submodules/reptracker
      # Mount .git for generate_version_sql.sh scripts
      - ../.git:/home/haf_admin/haf_block_explorer/.git

volumes:
  haf_datadir:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${HAF_DATA_DIRECTORY}/
  haf_shmdir:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${HAF_SHM_DIRECTORY}/

services:
  haf:
    environment:
      PGCTLTIMEOUT: 600
      PG_ACCESS: "
        host    all    all    all    trust\n
        "
    ports:
      - 5432:5432

  # Additional development-only volume mounts for app-setup
  app-setup:
    volumes:
      # Mount submodules for live development changes
      - ../submodules/hafah:/home/haf_admin/haf_block_explorer/submodules/hafah
      - ../submodules/btracker:/home/haf_admin/haf_block_explorer/submodules/btracker
      - ../submodules/reptracker:/home/haf_admin/haf_block_explorer/submodules/reptracker
      # For version generation (dev-only, not needed in CI)
      - ../scripts/generate_version_sql.sh:/home/haf_admin/haf_block_explorer/scripts/generate_version_sql.sh
      - ../.git:/home/haf_admin/haf_block_explorer/.git

volumes:
  haf_datadir:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${HAF_DATA_DIRECTORY}/
  haf_shmdir:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${HAF_SHM_DIRECTORY}/
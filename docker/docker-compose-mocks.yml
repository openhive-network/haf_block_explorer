name: 'haf-be-mocks'
services:
  haf:
    image: ${HAF_REGISTRY:-registry.gitlab.syncad.com/hive/haf/instance}:${HAF_VERSION:-9ec94375}
    entrypoint: /home/hived/docker_entrypoint.sh
    command: ["--skip-hived"]
    environment:
      DATADIR: /home/hived/datadir
      SHM_DIR: /home/hived/shm_dir
      PGCTLTIMEOUT: 600
      PG_ACCESS: |
        host    all    all    all    trust
    ports:
      - "5432:5432"
    volumes:
      - haf_datadir:/home/hived/datadir
      - haf_shmdir:/home/hived/shm_dir
      - ./blockchain:/home/hived/datadir/blockchain
      - ./scripts/haf-healthcheck.sh:/home/hived/healthcheck.sh
    networks:
      haf-network:
    healthcheck:
      test: ["CMD-SHELL","/home/hived/healthcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 48h

  fill-db-with-mock-data:
    image: ${BACKEND_REGISTRY:-registry.gitlab.syncad.com/hive/haf_block_explorer}:${BACKEND_VERSION:-latest}
    working_dir: /home/hived/haf_block_explorer
    entrypoint:
      - /bin/bash
      - -lc
      - ./tests/mocks/install_mock_data.sh --host=haf --port=5432
    environment:
      POSTGRES_HOST: haf
    volumes:
      - ../tests/mocks:/home/hived/haf_block_explorer/tests/mocks:ro
    networks:
      haf-network:
    depends_on:
      haf:
        condition: service_healthy

  backend-block-processing:
    image: ${BACKEND_REGISTRY:-registry.gitlab.syncad.com/hive/haf_block_explorer}:${BACKEND_VERSION:-latest}
    command:
      - process_blocks
      - --stop-at-block=91000006
      - --log-file=STDOUT
    environment:
      POSTGRES_HOST: haf
      POSTGRES_USER: hafbe_owner
    networks:
      haf-network:
    healthcheck:
      test: ["CMD-SHELL","/app/block-processing-healthcheck.sh"]
      interval: 60s
      timeout: 5s
      retries: 20
      start_period: 72h
    depends_on:
      fill-db-with-mock-data:
        condition: service_completed_successfully

networks:
  haf-network:
    name: haf-network

volumes:
  haf_datadir:
    driver: local
  haf_shmdir:
    driver: local

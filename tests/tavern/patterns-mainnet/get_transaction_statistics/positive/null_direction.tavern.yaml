---
  test_name: Hafbe PostgREST

  marks:
    - patterntest

  includes:
    - !include ../../../common.yaml

  stages:
    - name: test
      request:
        url: "{service.proto:s}://{service.server:s}:{service.port}/rpc/get_transaction_statistics"
        method: POST
        headers:
          content-type: application/json
          accept: application/json
        json:
          granularity: "monthly"
          direction: null
          # monthly + a bounded range on purpose: this case exists to prove
          # COALESCE("direction",'desc') normalises an explicit null. Using daily over this
          # range would make it byte-identical to change_range and assert nothing new.
          from-block: "4000000"
          to-block: "5000000"
      response:
        status_code: 200
        verify_response_with:
          function: validate_response:compare_rest_response_with_pattern

---
  test_name: Hafbe PostgREST

  marks:
    - patterntest
    - negative

  includes:
    - !include ../../../common.yaml

  stages:
    - name: test
      request:
        url: "{service.proto:s}://{service.server:s}:{service.port}/rpc/get_hbd_status"
        method: POST
        headers:
          content-type: application/json
          accept: application/json
        json:
          from-block: "5000000"
          to-block: "4000000"
      response:
        status_code: 400
        verify_response_with:
          function: validate_response:compare_rest_response_with_pattern
          extra_kwargs:
            error_response: true

---
# A daily request with NO block range. On a full-history node the endpoint falls back to
# hafbe_backend.default_stats_window() (1 year) instead of scanning the whole chain, which is
# what issue #139 was about. The 5M-block test dataset spans <1 year, so here the fallback must
# NOT fire and the complete history is expected back -- this pins the "no over-clamping" half of
# the behaviour, and nothing more.
#
# It CANNOT pin the clamp itself. Inverting the _from_omitted argument produces byte-identical
# output on this dataset (176 periods here, 36 for change_range), so the arming condition is
# invisible to every Tavern fixture. That half is asserted directly against the pure function in
# tests/mocks/sql/verify_stats_window.sql -- change this behaviour and update BOTH.
  test_name: Hafbe PostgREST

  marks:
    - patterntest

  includes:
    - !include ../../../common.yaml

  stages:
    - name: test
      request:
        url: "{service.proto:s}://{service.server:s}:{service.port}/rpc/get_operation_type_statistics"
        method: POST
        headers:
          content-type: application/json
          accept: application/json
        json:
          granularity: "daily"
      response:
        status_code: 200
        verify_response_with:
          function: validate_response:compare_rest_response_with_pattern

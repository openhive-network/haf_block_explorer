---
  test_name: Hafbe PostgREST

  marks:
    - patterntest

  includes:
    - !include ../../../common.yaml

  stages:
    - name: test
      request:
        url: "{service.proto:s}://{service.server:s}:{service.port}/rpc/get_operation_type_statistics"
        method: POST
        headers:
          content-type: application/json
          accept: application/json
        json:
          granularity: "monthly"
          from-block: "1000000"
          to-block: "5000000"
          op-types: "0,1,18"
      response:
        status_code: 200
        verify_response_with:
          function: validate_response:compare_rest_response_with_pattern

---
  test_name: Hafbe PostgREST

  marks:
    - patterntest

  includes:
    - !include ../../../common.yaml

  stages:
    - name: test
      request:
        url: "{service.proto:s}://{service.server:s}:{service.port}/rpc/get_operation_type_statistics"
        method: POST
        headers:
          content-type: application/json
          accept: application/json
        json:
          granularity: "daily"
          direction: null
          # Bounded range on purpose: this case exists to prove COALESCE("direction",'desc')
          # normalises an explicit null, not to re-assert the full daily series that
          # daily_no_range already pins. Without the bound the two fixtures are byte-identical.
          from-block: "4000000"
          to-block: "5000000"
      response:
        status_code: 200
        verify_response_with:
          function: validate_response:compare_rest_response_with_pattern

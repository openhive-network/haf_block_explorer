---
  test_name: Hafbe PostgREST

  marks:
    - patterntest

  includes:
    - !include ../../../common.yaml

  stages:
    - name: test
      request:
        url: "{service.proto:s}://{service.server:s}:{service.port}/rpc/get_proposal_votes_history"
        method: POST
        headers:
          content-type: application/json
          accept: application/json
        json:
          proposal-id: 99999999
          page-size: 50
          direction: "desc"
          from-block: 50000000
          to-block: 51000000
      response:
        status_code: 200
        verify_response_with:
          function: validate_response:compare_rest_response_with_pattern

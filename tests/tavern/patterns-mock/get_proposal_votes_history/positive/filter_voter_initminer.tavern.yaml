---
  # initminer is still a current voter on 9002, so it has a row in
  # hafbe_app.account_vest_stats_cache — which verify_mock_data.sh seeds to a
  # deterministic (5000000, 5000000, 0). This test pins the cache-HIT branch.
  test_name: Hafbe PostgREST

  marks:
    - patterntest

  includes:
    - !include ../../../common.yaml

  stages:
    - name: test
      request:
        url: "{service.proto:s}://{service.server:s}:{service.port}/rpc/get_proposal_votes_history"
        method: POST
        headers:
          content-type: application/json
          accept: application/json
        json:
          proposal-id: 9002
          voter-name: "initminer"
          direction: "asc"
      response:
        status_code: 200
        verify_response_with:
          function: validate_response:compare_rest_response_with_pattern

---
# Witness daily vote change counts LOST votes (issue #142), asserted through the endpoint.
#
# The daily-change window starts at the first block of the head's UTC day. The mock dataset
# dates only its head block (91000006) 2025-06-01 and the blocks before it 2025-05-31, so the
# window is that block alone, which is what puts the approve outside it and the un-vote in.
#
# Fixture: cvk approves gtg at 91000001 (outside the window) and un-votes at 91000006
# (inside it). cvk holds no proxy and no proposal vote, so it leaves the current-voter set
# entirely -- the account Cache 4 used to drop.
#
# Expected values are DERIVED, not captured: voters_num_daily_change -1 (one un-vote,
# stake-free count) and votes_daily_change "-121206758926" (cvk's stake). Both read 0
# without the fix. If a run disagrees, the FIX is wrong -- do not edit these to match.
#
# votes_change_breakdown is the one CI's sync job seeds at the 5M head (as_of_block 5000000,
# equal to patterns-mainnet/get_witness/gtg's): the mock blocks do not refresh it. HAF stages
# them by the head it estimates from the wall clock, millions of blocks past the 2025-dated
# mock head, so they run in MASSIVE_PROCESSING, and single_processing() -- the only caller of
# the per-block refresh -- never sees them. Update it together with gtg's mainnet pattern.

  test_name: Hafbe PostgREST

  marks:
    - patterntest

  includes:
    - !include ../../../common.yaml

  stages:
    - name: test
      request:
        url: "{service.proto:s}://{service.server:s}:{service.port}/rpc/get_witness"
        method: POST
        headers:
          content-type: application/json
          accept: application/json
        json:
          account-name: "gtg"
      response:
        status_code: 200
        verify_response_with:
          function: validate_response:compare_rest_response_with_pattern
          extra_kwargs:
            ignore_tags: "<hafbe cache_update>"

# Skip rules for CI job optimization based on changed files
# Include this file and use the patterns/templates in job rules
#
# Features:
#   1. Skip builds AND tests for docs-only changes
#   2. QUICK_TEST mode - use cached HAF data to skip prepare_haf_data job
#   3. Run full pipeline for source code changes
#
# Usage:
#   Set QUICK_TEST=true and QUICK_TEST_HAF_COMMIT=<commit> to skip HAF rebuild/replay

variables:
  # Control variable to force full pipeline regardless of changes
  FORCE_FULL_PIPELINE: "false"
  # Set by detect_changes job - indicates only docs/non-source files changed
  DOCS_ONLY: "false"

# ============================================================================
# Change Detection Job
# ============================================================================

.detect_changes:
  stage: lint
  image: alpine:latest
  needs: []
  before_script:
    - apk add --no-cache git
  script:
    - |
      echo "Detecting what files changed..."

      # Determine base commit to compare against
      if [ -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA" ]; then
        BASE_SHA="$CI_MERGE_REQUEST_DIFF_BASE_SHA"
        echo "Using MR diff base: $BASE_SHA"
      elif [ -n "$CI_COMMIT_BEFORE_SHA" ] && [ "$CI_COMMIT_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
        BASE_SHA="$CI_COMMIT_BEFORE_SHA"
        echo "Using commit before SHA: $BASE_SHA"
      else
        BASE_SHA="HEAD~1"
        echo "Using HEAD~1 as base"
      fi

      # Get list of changed files
      echo "Changed files:"
      git diff --name-only "$BASE_SHA" HEAD 2>/dev/null || git diff --name-only HEAD~1 HEAD | head -50

      # Check if source code changed (files that require builds/sync)
      SOURCE_CHANGED="false"
      if git diff --name-only "$BASE_SHA" HEAD 2>/dev/null | grep -qE '^(backend/|endpoints/|docker/|scripts/|submodules/|Dockerfile|\.gitlab-ci\.yml)'; then
        SOURCE_CHANGED="true"
      fi

      # Check if tests changed
      TESTS_CHANGED="false"
      if git diff --name-only "$BASE_SHA" HEAD 2>/dev/null | grep -qE '^tests/'; then
        TESTS_CHANGED="true"
      fi

      # Determine if this is a docs-only change
      # Docs-only means: only docs/readme/misc files changed, no source code or tests
      DOCS_ONLY="false"
      if [ "$SOURCE_CHANGED" = "false" ] && [ "$TESTS_CHANGED" = "false" ]; then
        echo "No source or test changes detected"
        # Verify something actually changed (not empty commit)
        if git diff --name-only "$BASE_SHA" HEAD 2>/dev/null | grep -q .; then
          DOCS_ONLY="true"
          echo ">>> DOCS_ONLY=true - skipping builds and tests"
        fi
      fi

      echo ""
      echo "Detection results:"
      echo "  SOURCE_CHANGED=$SOURCE_CHANGED"
      echo "  TESTS_CHANGED=$TESTS_CHANGED"
      echo "  DOCS_ONLY=$DOCS_ONLY"

      # Write to dotenv file for other jobs
      echo "DOCS_ONLY=$DOCS_ONLY" > detect_changes.env
      echo "SOURCE_CHANGED=$SOURCE_CHANGED" >> detect_changes.env
  artifacts:
    reports:
      dotenv: detect_changes.env
  rules:
    # Skip detection on protected branches - always run full pipeline
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "master"
      when: never
    # Skip on tags
    - if: $CI_COMMIT_TAG
      when: never
    # Skip if forcing full pipeline
    - if: $FORCE_FULL_PIPELINE == "true"
      when: never
    # Skip if QUICK_TEST is manually enabled
    - if: $QUICK_TEST == "true"
      when: never
    - when: on_success
  tags:
    - public-runner-docker

detect_changes:
  extends: .detect_changes

# ============================================================================
# Rule Templates for Jobs
# ============================================================================

# Template: Skip build/sync jobs if only docs changed or QUICK_TEST enabled
.skip_on_docs_only_or_quick_test:
  rules:
    # QUICK_TEST mode - skip builds
    - if: $QUICK_TEST == "true"
      when: never
    # DOCS_ONLY mode - skip builds
    - if: $DOCS_ONLY == "true"
      when: never
    # Force full pipeline if requested
    - if: $FORCE_FULL_PIPELINE == "true"
      when: on_success
    # Always run on protected branches
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "master"
      when: on_success
    # Always run on tags
    - if: $CI_COMMIT_TAG
      when: on_success
    # Run if source files changed
    - changes:
        paths:
          - backend/**/*
          - endpoints/**/*
          - docker/**/*
          - scripts/**/*
          - submodules/**/*
          - Dockerfile
          - .gitlab-ci.yml
      when: on_success
    # Skip otherwise (docs-only changes)
    - when: never

# Template: Skip test jobs if only docs changed
.skip_test_on_docs_only:
  rules:
    # DOCS_ONLY mode - skip tests
    - if: $DOCS_ONLY == "true"
      when: never
    # Force full pipeline if requested
    - if: $FORCE_FULL_PIPELINE == "true"
      when: on_success
    # Always run on protected branches
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "master"
      when: on_success
    # Always run on tags
    - if: $CI_COMMIT_TAG
      when: on_success
    # Run if any non-doc files changed
    - changes:
        paths:
          - backend/**/*
          - endpoints/**/*
          - docker/**/*
          - scripts/**/*
          - submodules/**/*
          - tests/**/*
          - Dockerfile
          - .gitlab-ci.yml
      when: on_success
    # Skip otherwise (docs-only changes)
    - when: never

# Template: Skip test jobs if docs-only, with QUICK_TEST support
# In QUICK_TEST mode, tests still run (using cached data)
.skip_test_on_docs_only_with_quick_test:
  rules:
    # DOCS_ONLY mode - skip tests
    - if: $DOCS_ONLY == "true"
      when: never
    # Force full pipeline if requested
    - if: $FORCE_FULL_PIPELINE == "true"
      when: on_success
    # QUICK_TEST mode - run tests with cached data
    - if: $QUICK_TEST == "true"
      when: on_success
    # Always run on protected branches
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "master"
      when: on_success
    # Always run on tags
    - if: $CI_COMMIT_TAG
      when: on_success
    # Run if any non-doc files changed
    - changes:
        paths:
          - backend/**/*
          - endpoints/**/*
          - docker/**/*
          - scripts/**/*
          - submodules/**/*
          - tests/**/*
          - Dockerfile
          - .gitlab-ci.yml
      when: on_success
    # Skip otherwise (docs-only changes)
    - when: never

# Template: Manual on feature branches, auto on integration branches
.manual_on_feature_branches:
  rules:
    # Force full pipeline overrides everything
    - if: $FORCE_FULL_PIPELINE == "true"
      when: on_success
    # DOCS_ONLY mode - skip entirely
    - if: $DOCS_ONLY == "true"
      when: never
    # QUICK_TEST mode - make jobs manual
    - if: $QUICK_TEST == "true"
      when: manual
      allow_failure: true
    # Always run automatically on protected branches
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "master"
      when: on_success
    # Always run automatically on tags
    - if: $CI_COMMIT_TAG
      when: on_success
    # Feature branches: manual by default
    - when: manual
      allow_failure: true

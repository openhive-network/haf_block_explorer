# =============================================================================
# TEST JOB BASE TEMPLATE (Docker Compose)
# =============================================================================
# All test jobs use docker-compose-test.yml instead of service containers.
# This provides better control over container lifecycle and cache extraction.

.hafbe_test_base:
  extends: .docker_image_builder_job_template
  stage: test
  # Shared HAF app test runner from common-ci-configuration
  # Has: Python 3.14, Poetry, Docker CLI, docker-compose, JMeter, m2u
  image: ${HAF_APP_TEST_RUNNER_IMAGE}
  needs:
  - job: find_haf_image
    artifacts: true
  - job: quick_test_setup
    artifacts: true
    optional: true
  - job: sync
    artifacts: true
  rules:
  - if: $DOCS_ONLY == "true"
    when: never
  - when: on_success
  variables:
    # Docker-in-docker connection - TLS enabled
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
    # Test data directory - extracted from sync cache
    HAF_DATA_DIRECTORY: "${CI_PROJECT_DIR}/test-data"
    COMPOSE_FILE: "docker/docker-compose-test.yml"
    # Service hostnames - use 'docker' since that's the dind service where containers run
    HAF_HOST: "docker"
    POSTGREST_HOST: "docker"
    # No submodules needed for tests
    GIT_SUBMODULE_STRATEGY: none
    HAF_APP_SCHEMA: "hafbe_app"
    # Map HAF_UPSTREAM_IMAGE from find_haf_image to HAF_IMAGE_NAME for docker-compose
    HAF_IMAGE_NAME: "${HAF_UPSTREAM_IMAGE}"
    # Local bin for non-root docker/compose installation
    LOCAL_BIN: "${CI_PROJECT_DIR}/.local-bin"
  before_script:
    # Git setup (from docker_image_builder_job_template, without buildx)
  - git config --global --add safe.directory '*'
    # Create docker-compose wrapper for 'docker compose' plugin (haf-app-test-runner has docker-compose-v2)
  - |
    mkdir -p "$LOCAL_BIN"
    export PATH="$LOCAL_BIN:$PATH"
    if ! command -v docker-compose &> /dev/null; then
      printf '#!/bin/sh\nexec docker compose "$@"\n' > "$LOCAL_BIN/docker-compose"
      chmod +x "$LOCAL_BIN/docker-compose"
    fi
   # Fetch cache-manager
  - !reference [.fetch_cache_manager, before_script]
    # Create data directory
  - mkdir -p "${HAF_DATA_DIRECTORY}"
    # Extract sync cache
  - |
    echo -e "\e[0Ksection_start:$(date +%s):extract_cache[collapsed=true]\r\e[0KExtracting sync cache..."
    export SKIP_WAIT=true  # Don't wait for postgres yet
    ./scripts/ci-helpers/extract-cache-and-wait.sh "${APP_SYNC_CACHE_TYPE}" "${APP_CACHE_KEY}" "${HAF_DATA_DIRECTORY}"
    echo -e "\e[0Ksection_end:$(date +%s):extract_cache\r\e[0K"
   # Start docker-compose
  - |
    export PATH="$LOCAL_BIN:$PATH"
    # Ensure container can write to extracted data
    chmod -R 777 "${HAF_DATA_DIRECTORY}" 2>/dev/null || sudo chmod -R 777 "${HAF_DATA_DIRECTORY}" || true
    echo -e "\e[0Ksection_start:$(date +%s):compose_up[collapsed=true]\r\e[0KStarting test environment..."
    docker-compose -f "${COMPOSE_FILE}" up -d
    echo -e "\e[0Ksection_end:$(date +%s):compose_up\r\e[0K"
   # Wait for services to be ready
  - |
    export PATH="$LOCAL_BIN:$PATH"
    echo -e "\e[0Ksection_start:$(date +%s):wait_services[collapsed=true]\r\e[0KWaiting for services..."
    ./scripts/ci-helpers/wait-for-postgrest.sh
    echo -e "\e[0Ksection_end:$(date +%s):wait_services\r\e[0K"
  after_script:
  - |
    export PATH="$LOCAL_BIN:$PATH"
    echo -e "\e[0Ksection_start:$(date +%s):compose_down[collapsed=true]\r\e[0KStopping test environment..."
    docker-compose -f "${COMPOSE_FILE:-docker/docker-compose-test.yml}" logs > docker/container-logs.txt 2>&1 || true
    docker-compose -f "${COMPOSE_FILE:-docker/docker-compose-test.yml}" down -v || true
    # Cleanup test data
    rm -rf "${HAF_DATA_DIRECTORY:-/tmp/test-data}" 2>/dev/null || sudo rm -rf "${HAF_DATA_DIRECTORY:-/tmp/test-data}" || true
    echo -e "\e[0Ksection_end:$(date +%s):compose_down\r\e[0K"
  artifacts:
    paths:
    - docker/container-logs.txt
    when: always
    expire_in: 1 week
  tags:
  - public-runner-docker
  - data-cache-storage
  - fast

# =============================================================================
# TAVERN TEST TEMPLATE
# =============================================================================
# Extends .hafbe_test_base with Tavern-specific configuration from common-ci.
# Uses centralized template for consistent testing patterns across HAF apps.

.test-with-docker-compose-tavern:
  extends:
  - .hafbe_test_base
  - .tavern_test_variables
  variables:
    # Override tavern variables for haf_block_explorer
    TAVERN_DIR: "${CI_PROJECT_DIR}/tests/tavern/patterns-mainnet"
    JUNIT_REPORT: "${CI_PROJECT_DIR}/tests/tavern/patterns-mainnet/report.xml"
    # PostgREST host for tests (docker DinD host)
    HAFBE_ADDRESS: "${POSTGREST_HOST}"
    HAFBE_PORT: "3000"
  before_script:
  - !reference [.hafbe_test_base, before_script]
    # Clone tests_api directly (nested submodule can't be fetched due to GitLab Runner 18.6+ credential inheritance)
  - git clone --depth=1 https://gitlab.syncad.com/hive/tests_api.git "${CI_PROJECT_DIR}/tests_api"
    # Set up Python venv with pytest/tavern and validate_response from tests_api
  - !reference [.tavern_install_deps, script]
  - |
    # venv created by tavern_install_deps is in current dir (project root)
    . venv/bin/activate
    pip install --quiet "${CI_PROJECT_DIR}/tests_api"
  artifacts:
    paths:
    - docker/container-logs.txt
    - "**/*.out.json"
    when: always
    reports:
      junit: "${CI_PROJECT_DIR}/tests/tavern/patterns-mainnet/report.xml"

# =============================================================================
# TEST JOBS
# =============================================================================

regression-test:
  extends: .hafbe_test_base
  script:
  - |
    echo -e "\e[0Ksection_start:$(date +%s):tests\r\e[0KRunning regression tests..."

    cd tests/regression
    ./run_test.sh --host=${HAF_HOST} --type=all

    echo -e "\e[0Ksection_end:$(date +%s):tests\r\e[0K"
  artifacts:
    paths:
    - docker/container-logs.txt
    - tests/regression/regression_test.log
    when: always

setup-scripts-test:
  extends: .hafbe_test_base
  variables:
    # GitLab Runner 18.6+ doesn't inherit credentials to nested submodules (tests_api in btracker)
    # Use manual init without recursion since this job doesn't need tests_api
    GIT_SUBMODULE_STRATEGY: none
  script:
  - |
    echo -e "\e[0Ksection_start:$(date +%s):submodules\r\e[0KInitializing submodules..."
    # Fetch submodules using common-ci-configuration script (handles root-owned files from Docker)
    FETCH_SUBMODULES_REF="${COMMON_CI_REF:-develop}"
    curl -fsSL "https://gitlab.syncad.com/hive/common-ci-configuration/-/raw/${FETCH_SUBMODULES_REF}/scripts/fetch-submodules.sh" -o /tmp/fetch-submodules.sh
    chmod +x /tmp/fetch-submodules.sh
    /tmp/fetch-submodules.sh --parallel submodules/btracker submodules/reptracker
    echo -e "\e[0Ksection_end:$(date +%s):submodules\r\e[0K"

    echo -e "\e[0Ksection_start:$(date +%s):tests\r\e[0KRunning functional tests..."

    # Make submodules writable (needed for generate_version_sql scripts to write set_version_in_sql.pgsql)
    # Without this, reused workspace checkouts may have stale files with restrictive permissions
    chmod -R 777 "${CI_PROJECT_DIR}/submodules/btracker" 2>/dev/null || sudo chmod -R 777 "${CI_PROJECT_DIR}/submodules/btracker"
    chmod -R 777 "${CI_PROJECT_DIR}/submodules/reptracker" 2>/dev/null || sudo chmod -R 777 "${CI_PROJECT_DIR}/submodules/reptracker"

    cd tests/functional
    ./test_scripts.sh --host=${HAF_HOST}

    echo -e "\e[0Ksection_end:$(date +%s):tests\r\e[0K"

performance-test:
  extends: .hafbe_test_base
  script:
  - |
    echo -e "\e[0Ksection_start:$(date +%s):tests\r\e[0KRunning performance tests..."

    timeout -k 1m 15m ./tests/performance/run_performance_tests.sh --postgresql-host=${HAF_HOST} --postgrest-host=${POSTGREST_HOST} --database-size=6000 --test-loop-count=1000
    tar -cf - $(pwd)/tests/performance/result* | 7z a -si -mx9 tests/performance/results.tar.7z
    cat jmeter.log | python3 docker/ci/parse-jmeter-output.py
    m2u --input $(pwd)/tests/performance/result/result.xml --output $(pwd)/tests/performance/junit-result.xml

    echo -e "\e[0Ksection_end:$(date +%s):tests\r\e[0K"
  artifacts:
    paths:
    - docker/container-logs.txt
    - tests/performance/result/result_report/
    - tests/performance/results.tar.7z
    - jmeter.log
    when: always
    reports:
      junit: tests/performance/junit-result.xml

pattern-test:
  extends: .test-with-docker-compose-tavern
  variables:
    # GitLab Runner 18.6+ doesn't inherit credentials to nested submodules
    # Use none since template clones tests_api directly
    GIT_SUBMODULE_STRATEGY: none
  script:
  - |
    # Activate venv for pytest
    . venv/bin/activate

    echo -e "\e[0Ksection_start:$(date +%s):warmup[collapsed=true]\r\e[0KWarming up database..."

    # Warmup: Run a complex query to warm PostgreSQL caches
    # This helps avoid statement timeouts on cold database (hafbe_user has 10s timeout)
    curl -s --max-time 15 -X POST "http://${POSTGREST_HOST}:3000/rpc/get_witness_votes_history" \
      -H "Content-Type: application/json" \
      -d '{"account-name":"blocktrades","page-size":5}' > /dev/null 2>&1 || true

    echo -e "\e[0Ksection_end:$(date +%s):warmup\r\e[0K"

    echo -e "\e[0Ksection_start:$(date +%s):tests\r\e[0KRunning Tavern API tests..."

    # Run from project root so pattern file paths resolve correctly
    pytest -n "${PYTEST_NUMBER_OF_PROCESSES}" --junitxml "${JUNIT_REPORT}" "${TAVERN_DIR}"

    echo -e "\e[0Ksection_end:$(date +%s):tests\r\e[0K"

pattern-test-with-mock-data:
  extends: .test-with-docker-compose-tavern
  needs:
  - job: find_haf_image
    artifacts: true
  - job: quick_test_setup
    artifacts: true
    optional: true
  - job: sync_with_mock_data
    artifacts: true
  variables:
    GIT_SUBMODULE_STRATEGY: none
    APP_SYNC_CACHE_TYPE: "${HAFBE_MOCK_CACHE_TYPE}"
    TAVERN_DIR: "${CI_PROJECT_DIR}/tests/tavern/patterns-mock"
    JUNIT_REPORT: "${CI_PROJECT_DIR}/tests/tavern/patterns-mock/report.xml"
  artifacts:
    paths:
    - docker/container-logs.txt
    - "**/*.out.json"
    when: always
    reports:
      junit: "${CI_PROJECT_DIR}/tests/tavern/patterns-mock/report.xml"
  script:
  - |
    . venv/bin/activate
    echo -e "\e[0Ksection_start:$(date +%s):tests\r\e[0KRunning mock Tavern tests..."
    pytest -n "${PYTEST_NUMBER_OF_PROCESSES}" --junitxml "${JUNIT_REPORT}" "${TAVERN_DIR}"
    echo -e "\e[0Ksection_end:$(date +%s):tests\r\e[0K"

# Publish to registry.hive.blog on protected tags only
# Uses pull/retag/push pattern - no rebuild
publish_images:
  extends: .docker_publish_job_template
  variables:
    # haf_block_explorer root image + postgrest-rewriter
    PUBLISH_IMAGES: "haf_block_explorer postgrest-rewriter"


stages:
- detect
- lint
- build
- sync
- test
- publish
- cleanup

variables:
  # Git configuration
  # Fetch strategy reuses workspace between jobs, reducing GitLab server load.
  # Full clone (depth 0) enables efficient incremental fetches - shallow clones
  # don't reduce server CPU and make fetch less effective.
  GIT_STRATEGY: fetch
  GIT_DEPTH: 0
  GIT_SUBMODULE_DEPTH: 0
  # Use 'normal' not 'recursive' - recursive causes file:// URL errors for nested submodules
  GIT_SUBMODULE_STRATEGY: normal
  # Temporary: separate clone path prevents clone-strategy jobs from erasing
  # fetch workspaces during transition. Remove once all projects use fetch.
  GIT_CLONE_PATH: $CI_BUILDS_DIR/fetch/$CI_RUNNER_SHORT_TOKEN/$CI_CONCURRENT_ID/$CI_PROJECT_PATH
  GIT_SUBMODULE_UPDATE_FLAGS: --jobs 4
  # HAF configuration
  DATA_CACHE_HAF_PREFIX: "/cache/replay_data_haf"
  # NFS cache configuration for sync data sharing across builders
  DATA_CACHE_NFS_PREFIX: "/nfs/ci-cache"
  HAFBE_CACHE_KEY: "${HAF_COMMIT}_${CI_COMMIT_SHORT_SHA}"
  # Cache type prefixed with haf_ for automatic pgdata permission handling by cache-manager
  HAFBE_SYNC_CACHE_TYPE: "haf_hafbe_sync"
  BLOCK_LOG_SOURCE_DIR_5M: /blockchain/block_log_5m
  FF_NETWORK_PER_BUILD: 1
  PYTEST_NUMBER_OF_PROCESSES: 8
  # uses registry.gitlab.syncad.com/hive/hive/ci-base-image:ubuntu24.04-py3.14-1 (via $TEST_HAF_IMAGE_TAG from HAF)
  BUILDER_IMAGE_TAG: "$TEST_HAF_IMAGE_TAG"
  BUILDER_IMAGE_PATH: "registry.gitlab.syncad.com/hive/hive/ci-base-image${BUILDER_IMAGE_TAG}"
  # HAF submodule commit - must match the 'ref:' in the include section below
  # This is needed for service containers which can't access dotenv artifacts
  HAF_COMMIT: "b4225f9d2591195b0e6aadf36bbef921d95f92b9"
  # Enable CI-specific PostgreSQL config with reduced memory for HAF service containers
  HAF_CI_MODE: "1"

  # Quick Test Mode - uses cached HAF data from previous pipeline, skips HAF rebuild/replay
  # Usage: Set QUICK_TEST=true and QUICK_TEST_HAF_COMMIT to a commit with cached data
  # Find available cache keys: ssh hive-builder-10 'ls -lt /nfs/ci-cache/haf/*.tar | head -5'
  QUICK_TEST: "false"
  QUICK_TEST_HAF_COMMIT: ""

  # Aliases for common-ci-configuration template compatibility
  APP_SYNC_CACHE_TYPE: "${HAFBE_SYNC_CACHE_TYPE}"
  APP_CACHE_KEY: "${HAFBE_CACHE_KEY}"
  HAF_APP_SCHEMA: "hafbe_app"

include:
- template: Workflows/Branch-Pipelines.gitlab-ci.yml
- project: hive/haf
  ref: b4225f9d2591195b0e6aadf36bbef921d95f92b9   # develop
  file: /scripts/ci-helpers/prepare_data_image_job.yml   # implicitly pulls templates/base.gitlab-ci.yml from common-ci-configuration
# HAF app testing templates - provides change detection, sync helpers, test base templates
- project: hive/common-ci-configuration
  ref: develop
  file: /templates/haf_app_testing.gitlab-ci.yml
# Skip rules: extends common .haf_app_detect_changes and adds project-specific rule templates
- local: '/scripts/ci-helpers/skip_rules.yml'

# Use common git corruption cleanup hook with project-specific nested submodule handling
default:
  hooks:
    pre_get_sources_script:
      # Base git corruption cleanup from common-ci-configuration
      - !reference [.haf_git_corruption_cleanup, hooks, pre_get_sources_script]
      # Project-specific: Clean nested submodules (btracker/hafah/reptracker all have nested haf submodule)
      - |
        (
        cd "${CI_PROJECT_DIR:-/builds}" 2>/dev/null || exit 0
        if [ -d ".git/modules/submodules" ]; then
          echo "pre_get_sources: removing nested submodule state under .git/modules/submodules"
          rm -rf .git/modules/submodules/btracker/modules 2>/dev/null || true
          rm -rf .git/modules/submodules/hafah/modules 2>/dev/null || true
          rm -rf .git/modules/submodules/reptracker/modules 2>/dev/null || true
          rm -rf .git/modules/submodules/haf/modules 2>/dev/null || true
          rm -rf submodules/btracker/haf 2>/dev/null || true
          rm -rf submodules/hafah/haf 2>/dev/null || true
          rm -rf submodules/reptracker/haf 2>/dev/null || true
          rm -rf submodules/haf/hive 2>/dev/null || true
        fi
        )

# =============================================================================
# LINT JOBS - Using common-ci-configuration templates
# =============================================================================

lint_bash_scripts:
  extends: .haf_app_lint_bash
  stage: lint
  variables:
    LINT_SCRIPTS_DIR: "."
    LINT_EXCLUDE_PATHS: "submodules"

lint_sql_scripts:
  extends: .haf_app_lint_sql
  stage: lint

# Quick Test Mode Setup - overrides HAF_COMMIT with cached version
quick_test_setup:
  stage: lint
  image: alpine:latest
  needs: []
  script:
    - |
      echo "Quick Test Mode enabled"
      echo "Using cached HAF data from commit: $QUICK_TEST_HAF_COMMIT"

      if [ -z "$QUICK_TEST_HAF_COMMIT" ]; then
        echo "ERROR: QUICK_TEST_HAF_COMMIT must be set when QUICK_TEST=true"
        echo "Find available cache keys: ssh hive-builder-10 'ls -lt /nfs/ci-cache/haf/*.tar | head -5'"
        exit 1
      fi

      # Override HAF_COMMIT with the cached version
      echo "HAF_COMMIT=$QUICK_TEST_HAF_COMMIT" > quick_test.env
      echo "HAFBE_CACHE_KEY=${QUICK_TEST_HAF_COMMIT}_${CI_COMMIT_SHORT_SHA}" >> quick_test.env
      cat quick_test.env
  artifacts:
    reports:
      dotenv: quick_test.env
  rules:
    - if: $QUICK_TEST == "true"
      when: always
    - when: never
  tags:
    - public-runner-docker

validate_haf_commit:
  extends: .haf_commit_validation
  stage: build
  variables:
    HAF_SUBMODULE_PATH: "submodules/haf"
    GIT_SUBMODULE_STRATEGY: none
  before_script:
    - apk add --no-cache git
    # Clean stale submodule state and init just haf submodule
    - rm -rf .git/modules/submodules
    - git submodule deinit -f --all 2>/dev/null || true
    - git submodule update --init submodules/haf
    # Extract include ref from .gitlab-ci.yml and set HAF_INCLUDE_REF
    - |
      INCLUDE_REF=$(grep -A2 "project:.*hive/haf" .gitlab-ci.yml | grep "ref:" | head -1 | sed 's/.*ref: *\([a-f0-9]*\).*/\1/' || true)
      export HAF_INCLUDE_REF="$INCLUDE_REF"
      echo "Extracted HAF_INCLUDE_REF=$HAF_INCLUDE_REF from .gitlab-ci.yml"
  rules:
    # Skip in QUICK_TEST mode - we're using cached data from a different commit
    - if: $QUICK_TEST == "true"
      when: never
    # Skip for docs-only changes
    - if: $DOCS_ONLY == "true"
      when: never
    - when: on_success

prepare_haf_image:
  stage: build
  extends: .prepare_haf_image
  needs:
    - job: detect_changes
      optional: true  # Not needed on protected branches
  variables:
    SUBMODULE_DIR: "$CI_PROJECT_DIR/submodules/haf"
    REGISTRY_USER: "$HAF_DEPLOY_USERNAME"
    REGISTRY_PASS: "$HAF_DEPLOY_TOKEN"
    # Avoid nested submodule issues
    GIT_SUBMODULE_STRATEGY: none
  before_script:
  - git config --global --add safe.directory $CI_PROJECT_DIR
  - git config --global --add safe.directory $CI_PROJECT_DIR/submodules/haf
  - git config --global --add safe.directory $CI_PROJECT_DIR/submodules/haf/hive
  # Clean up any stale submodule state - deinit first, then remove
  - git submodule deinit -f --all 2>/dev/null || true
  # Remove with sudo, then recreate with sudo and fix ownership so git can use them
  - sudo rm -rf .git/modules/submodules submodules 2>/dev/null || rm -rf .git/modules/submodules submodules 2>/dev/null || true
  - sudo mkdir -p .git/modules/submodules submodules && sudo chown -R $(id -u):$(id -g) .git/modules/submodules submodules
  # Manually init submodules without nested recursion
  - git submodule update --init --force submodules/haf
  # HAF scripts are symlinks to hive submodule - init it without recursion
  - git -C $CI_PROJECT_DIR/submodules/haf submodule update --init hive
  tags:
  - public-runner-docker

prepare_haf_data:
  extends: .prepare_haf_data_5m
  needs:
    - job: prepare_haf_image
      artifacts: true
  stage: build
  timeout: 80m
  variables:
    SUBMODULE_DIR: "$CI_PROJECT_DIR/submodules/haf"
    BLOCK_LOG_SOURCE_DIR: $BLOCK_LOG_SOURCE_DIR_5M
    CONFIG_INI_SOURCE: "$CI_PROJECT_DIR/submodules/haf/docker/config_5M.ini"
    # Avoid nested submodule issues
    GIT_SUBMODULE_STRATEGY: none
  before_script:
    - git config --global --add safe.directory $CI_PROJECT_DIR
    - git config --global --add safe.directory $CI_PROJECT_DIR/submodules/haf
    - git config --global --add safe.directory $CI_PROJECT_DIR/submodules/haf/hive
    # Clean up any stale submodule state - deinit first, then remove
    - git submodule deinit -f --all 2>/dev/null || true
    # Remove with sudo, then recreate with sudo and fix ownership so git can use them
    - sudo rm -rf .git/modules/submodules submodules 2>/dev/null || rm -rf .git/modules/submodules submodules 2>/dev/null || true
    - sudo mkdir -p .git/modules/submodules submodules && sudo chown -R $(id -u):$(id -g) .git/modules/submodules submodules
    # Manually init just the haf submodule without nested submodules
    - git submodule update --init --force submodules/haf
    # HAF scripts are symlinks to hive submodule - init it without recursion
    - git -C $CI_PROJECT_DIR/submodules/haf submodule update --init hive
  tags:
  - data-cache-storage
  - fast

.docker-base-build-template:
  extends: .docker_image_builder_job_template
  stage: build
  variables:
    BASE_REPO_NAME: ""
    BASE_TAG: ""
    NAME: ""
    TARGET: "$NAME"
    PROGRESS_DISPLAY: "plain"
  before_script:
  - !reference [.docker_image_builder_job_template, before_script]
  - |
    echo -e "\e[0Ksection_start:$(date +%s):login[collapsed=true]\r\e[0KLogging to Docker registry..."
    docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    echo -e "\e[0Ksection_end:$(date +%s):login\r\e[0K"
  script:
  - |
    echo -e "\e[0Ksection_start:$(date +%s):build[collapsed=true]\r\e[0KBaking $NAME${BASE_REPO_NAME:+/$BASE_REPO_NAME} image..."
    function image-exists() {
      local image=$1
      docker manifest inspect "$1" > /dev/null
      return $?
    }
    if image-exists "$CI_REGISTRY_IMAGE${NAME:+/$NAME}${BASE_REPO_NAME:+/$BASE_REPO_NAME}:${BASE_TAG}"; then
      echo "Image $CI_REGISTRY_IMAGE${NAME:+/$NAME}${BASE_REPO_NAME:+/$BASE_REPO_NAME}:${BASE_TAG} already exists. Skipping..."
      if [[ -n "$CI_COMMIT_TAG" && "$TARGET" == "full-ci" ]]; then
        echo "Tagging pre-existing image with Git tag..."
        docker pull "$CI_REGISTRY_IMAGE${NAME:+/$NAME}${BASE_REPO_NAME:+/$BASE_REPO_NAME}:${BASE_TAG}"
        docker tag "$CI_REGISTRY_IMAGE${NAME:+/$NAME}${BASE_REPO_NAME:+/$BASE_REPO_NAME}:${BASE_TAG}" "${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG}"
        docker push "${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG}"
      fi
    else
      echo "Baking $CI_REGISTRY_IMAGE${NAME:+/$NAME}${BASE_REPO_NAME:+/$BASE_REPO_NAME}:${BASE_TAG} image..."
      git config --global --add safe.directory $(pwd)
      scripts/ci-helpers/build_docker_image.sh "$CI_PROJECT_DIR"
    fi
    echo -e "\e[0Ksection_end:$(date +%s):build\r\e[0K"
  tags:
  - public-runner-docker

docker-setup-docker-image-build:
  extends: .docker-base-build-template
  rules:
    - if: $DOCS_ONLY == "true"
      when: never
    - when: on_success
  variables:
    GIT_SUBMODULE_STRATEGY: none
    GIT_DEPTH: 1
    BASE_REPO_NAME: ""
    BASE_TAG: "$CI_COMMIT_SHORT_SHA"
    NAME: ""
    TARGET: "full-ci"

extract-swagger-json:
  extends: .filter_out_swagger_json
  stage: build
  rules:
    - if: $DOCS_ONLY == "true"
      when: never
    - when: on_success
  variables:
    INPUT_SQL_SWAGGER_FILE: "${CI_PROJECT_DIR}/endpoints/endpoint_schema.sql"
    # Job only needs main repo files, not submodules
    GIT_SUBMODULE_STRATEGY: none
  tags:
  - public-runner-docker

generate-wax-spec:
  extends: .generate_swagger_package
  stage: build
  rules:
    - if: $DOCS_ONLY == "true"
      when: never
    - when: on_success
  variables:
    INPUT_JSON_SWAGGER_FILE: "${BUILT_JSON_SWAGGER_FILE}"
    API_TYPE: "rest"
    NPM_PACKAGE_SCOPE: "@hiveio"
    NPM_PACKAGE_NAME: "wax-api-hafbe"
    # Job uses artifacts, doesn't need submodules
    GIT_SUBMODULE_STRATEGY: none
  needs:
  - job: extract-swagger-json
    artifacts: true
  tags:
  - public-runner-docker

generate_python_api_client:
  extends: .project_develop_configuration_template
  # Override image to Python 3.12 - api_client_generator doesn't support Python 3.14 yet
  image: registry.gitlab.syncad.com/hive/common-ci-configuration/python:3.12.9-1
  stage: build
  rules:
    - if: $DOCS_ONLY == "true"
      when: never
    - when: on_success
  variables:
    PYPROJECT_DIR: "${CI_PROJECT_DIR}/scripts/python_api_package"
    # Job uses artifacts, doesn't need submodules
    GIT_SUBMODULE_STRATEGY: none
  needs:
  - job: extract-swagger-json
    artifacts: true
  script:
  - ${PYPROJECT_DIR}/generate_hafbe_api_client.sh
  artifacts:
    paths:
    - "${PYPROJECT_DIR}/hafbe_api"
    - "${PYPROJECT_DIR}/hafbe_api/hafbe_api_client"
  tags:
  - public-runner-docker

build_python_api_client_wheel:
  extends: .build_wheel_template
  # Use Python 3.12 for consistency with generate_python_api_client
  image: registry.gitlab.syncad.com/hive/common-ci-configuration/python:3.12.9-1
  stage: build
  rules:
    - if: $DOCS_ONLY == "true"
      when: never
    - when: on_success
  needs:
  - job: generate_python_api_client
    artifacts: true
  variables:
    PYPROJECT_DIR: "${CI_PROJECT_DIR}/scripts/python_api_package"
    # Job uses artifacts, doesn't need submodules
    GIT_SUBMODULE_STRATEGY: none
  tags:
  - public-runner-docker

sync:
  extends:
    - .docker_image_builder_job_template
    - .haf_app_sync_variables
  stage: sync
  # Shared HAF app test runner from common-ci-configuration
  image: registry.gitlab.syncad.com/hive/common-ci-configuration/haf-app-test-runner:2.1
  needs:
    - job: quick_test_setup
      artifacts: true
      optional: true  # Only runs in QUICK_TEST mode
    - job: prepare_haf_image
      optional: true  # Skipped in QUICK_TEST mode
    - job: prepare_haf_data
      optional: true  # Skipped in QUICK_TEST mode
    - job: docker-setup-docker-image-build
  rules:
    # Skip for docs-only changes
    - if: $DOCS_ONLY == "true"
      when: never
    - when: on_success
  variables:
    # Docker-in-docker connection (disable TLS for simplicity)
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: "tcp://docker:2375"
    DATA_SOURCE: ${DATA_CACHE_HAF_PREFIX}_${HAF_COMMIT}
    BACKEND_VERSION: "$CI_COMMIT_SHORT_SHA"
    # HAF image tag - use HAF_COMMIT to ensure correct image when prepare_haf_image is skipped
    HAF_REGISTRY_TAG: "$HAF_COMMIT"
    POSTGRES_ACCESS: postgresql://haf_admin@docker:5432/haf_block_log
    COMPOSE_OPTIONS_STRING: --env-file ci.env --file docker-compose.yml --file overrides/ci.yml
      --ansi never
    # Avoid nested submodule issues
    GIT_SUBMODULE_STRATEGY: none
    # Use local block_log on each builder (faster than NFS)
    SHARED_BLOCK_LOG_DIR: /blockchain/block_log_5m
  timeout: 1 hours
  before_script:
  # Docker login and git setup from common template
  - !reference [.haf_app_sync_setup, script]
  # Project-specific: Init nested submodules (btracker, hafah, reptracker each have nested haf)
  - |
    echo -e "\e[0Ksection_start:$(date +%s):submodules[collapsed=true]\r\e[0KInitializing submodules..."
    git config --global --add safe.directory "$CI_PROJECT_DIR/submodules/haf/hive"
    # Clean up any stale submodule state
    git submodule deinit -f --all 2>/dev/null || true
    sudo rm -rf .git/modules/submodules submodules 2>/dev/null || rm -rf .git/modules/submodules submodules 2>/dev/null || true
    sudo mkdir -p .git/modules/submodules submodules && sudo chown -R $(id -u):$(id -g) .git/modules/submodules submodules
    # Init all submodules and their nested haf submodules
    git submodule update --init --force
    git -C "$CI_PROJECT_DIR/submodules/haf" submodule update --init hive
    git -C "$CI_PROJECT_DIR/submodules/hafah" submodule update --init haf
    git -C "$CI_PROJECT_DIR/submodules/btracker" submodule update --init haf
    git -C "$CI_PROJECT_DIR/submodules/reptracker" submodule update --init haf
    echo -e "\e[0Ksection_end:$(date +%s):submodules\r\e[0K"
  # Fetch cache-manager and HAF replay data from common template
  - !reference [.fetch_cache_manager, before_script]
  - !reference [.haf_app_fetch_haf_cache, script]
  script:
  - |
    echo -e "\e[0Ksection_start:$(date +%s):compose[collapsed=true]\r\e[0KStarting the test environment..."

    "${CI_PROJECT_DIR}/submodules/haf/scripts/copy_datadir.sh"

    PGDATA_PATH="${DATADIR}/haf_db_store/pgdata"
    if [[ -d "$PGDATA_PATH" ]]; then
      echo "Restoring pgdata permissions to mode 700"
      sudo chmod 700 "$PGDATA_PATH"
      sudo chown -R 105:105 "${DATADIR}/haf_db_store"
      ls -la "${DATADIR}/haf_db_store/"
    fi

    rm -rf "${CI_PROJECT_DIR}/docker/blockchain"/*
    cp -a -L "${DATADIR}/blockchain"/* "${CI_PROJECT_DIR}/docker/blockchain/"

    # Run app-setup as root to allow writing to the container's scripts directory
    "${CI_PROJECT_DIR}/scripts/ci-helpers/start-ci-test-environment.sh" --setup-uid=0

    echo -e "\e[0Ksection_end:$(date +%s):compose\r\e[0K"
    echo -e "\e[0Ksection_start:$(date +%s):wait[collapsed=true]\r\e[0KWaiting for HAF BE startup..."

    "${CI_PROJECT_DIR}/scripts/ci-helpers/wait-for-haf-be-startup.sh"

    psql "$POSTGRES_ACCESS" -c "SET search_path to 'hafbe_bal','hafbe_rep'; SELECT hafbe_app.process_witness_votes_cache();"

    echo -e "\e[0Ksection_end:$(date +%s):wait\r\e[0K"
  after_script:
  - |
    echo -e "\e[0Ksection_start:$(date +%s):compose2[collapsed=true]\r\e[0KStopping test environment..."

    pushd docker
    IFS=" " read -ra COMPOSE_OPTIONS <<< $COMPOSE_OPTIONS_STRING
    docker compose "${COMPOSE_OPTIONS[@]}" logs haf > haf.log
    docker compose "${COMPOSE_OPTIONS[@]}" logs app-setup > app-setup.log
    docker compose "${COMPOSE_OPTIONS[@]}" logs backend-setup > backend-setup.log
    docker compose "${COMPOSE_OPTIONS[@]}" logs backend-rep-block-processing > backend-rep-block-processing.log
    docker compose "${COMPOSE_OPTIONS[@]}" logs backend-block-processing > backend-block-processing.log
    docker compose "${COMPOSE_OPTIONS[@]}" logs backend-postgrest > backend-postgrest.log
    docker compose "${COMPOSE_OPTIONS[@]}" down --volumes
    popd

    tar -cf - $(pwd)/docker/*.log | 7z a -si -mx9 docker/container-logs.tar.7z
    sudo cp -a "${SHM_DIR}" "${DATADIR}/shm_dir"

    LOCAL_HAFBE_CACHE="${DATA_CACHE_HAF_PREFIX}_${HAFBE_CACHE_KEY}"
    sudo mkdir -p "${LOCAL_HAFBE_CACHE}"
    sudo cp -a "${DATADIR}" "${LOCAL_HAFBE_CACHE}"

    ls -lah "${DATADIR}"
    ls -lah "${LOCAL_HAFBE_CACHE}" || true

    # Download cache-manager if not available in submodule (may have been cleaned)
    CACHE_MANAGER="${CI_PROJECT_DIR}/submodules/haf/scripts/ci-helpers/cache-manager.sh"
    if [[ ! -x "$CACHE_MANAGER" ]]; then
      CACHE_MANAGER="/tmp/cache-manager.sh"
      curl -fsSL "https://gitlab.syncad.com/hive/common-ci-configuration/-/raw/develop/scripts/cache-manager.sh" -o "$CACHE_MANAGER"
      chmod +x "$CACHE_MANAGER"
    fi
    if [[ -x "$CACHE_MANAGER" ]]; then
      echo "Pushing sync data to NFS cache: ${HAFBE_SYNC_CACHE_TYPE}/${HAFBE_CACHE_KEY}"
      CACHE_HANDLING=haf "$CACHE_MANAGER" put "${HAFBE_SYNC_CACHE_TYPE}" "${HAFBE_CACHE_KEY}" "${LOCAL_HAFBE_CACHE}" || echo "Warning: Failed to push to NFS cache"
      # Restore pgdata permissions on local cache (cache-manager put relaxes them for NFS copy)
      PGDATA_PATH="${LOCAL_HAFBE_CACHE}/datadir/haf_db_store/pgdata"
      if [[ -d "$PGDATA_PATH" ]]; then
        echo "Restoring local cache pgdata permissions to mode 700"
        sudo chmod 700 "$PGDATA_PATH"
      fi
    fi

    sudo rm -rf ${CI_PROJECT_DIR}/${CI_JOB_ID}

    echo -e "\e[0Ksection_end:$(date +%s):compose2\r\e[0K"
  artifacts:
    paths:
    - docker/container-logs.tar.7z
    expire_in: 1 week
    when: always
  tags:
  - data-cache-storage
  - fast

python_api_client_test:
  extends: .project_develop_configuration_template
  # Use Python 3.12 for consistency with generate_python_api_client
  image: registry.gitlab.syncad.com/hive/common-ci-configuration/python:3.12.9-1
  stage: test
  rules:
    - if: $DOCS_ONLY == "true"
      when: never
    - when: on_success
  needs:
  - job: generate_python_api_client
    artifacts: true
  variables:
    PYPROJECT_DIR: "${CI_PROJECT_DIR}/scripts/python_api_package"
    # Job uses artifacts, doesn't need submodules
    GIT_SUBMODULE_STRATEGY: none
  script:
  - pytest "${PYPROJECT_DIR}/tests"
  tags:
  - public-runner-docker

# =============================================================================
# TEST JOB BASE TEMPLATE (Docker Compose)
# =============================================================================
# All test jobs use docker-compose-test.yml instead of service containers.
# This provides better control over container lifecycle and cache extraction.

.hafbe_test_base:
  extends: .docker_image_builder_job_template
  stage: test
  # Shared HAF app test runner from common-ci-configuration
  # Has: Python 3.14, Poetry, Docker CLI, docker-compose, JMeter, m2u
  image: registry.gitlab.syncad.com/hive/common-ci-configuration/haf-app-test-runner:2.1
  needs:
    - job: quick_test_setup
      artifacts: true
      optional: true
    - job: sync
      artifacts: true
    - job: prepare_haf_image
      artifacts: true
      optional: true
  rules:
    - if: $DOCS_ONLY == "true"
      when: never
    - when: on_success
  variables:
    # Docker-in-docker connection (disable TLS for simplicity)
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: "tcp://docker:2375"
    # Test data directory - extracted from sync cache
    HAF_DATA_DIRECTORY: "${CI_PROJECT_DIR}/test-data"
    COMPOSE_FILE: "docker/docker-compose-test.yml"
    # Service hostnames - use 'docker' since that's the dind service where containers run
    HAF_HOST: "docker"
    POSTGREST_HOST: "docker"
    # Use recursive for nested submodules (haf/hive)
    GIT_SUBMODULE_STRATEGY: recursive
    HAF_APP_SCHEMA: "hafbe_app"
    # Local bin for non-root docker/compose installation
    LOCAL_BIN: "${CI_PROJECT_DIR}/.local-bin"
    # Run HAF container as root to access CI-extracted data
    HIVED_UID: "0"
  before_script:
    # Git setup (from docker_image_builder_job_template, without buildx)
    - git config --global --add safe.directory '*'
    # Create docker-compose wrapper for 'docker compose' plugin (haf-app-test-runner has docker-compose-v2)
    - |
      mkdir -p "$LOCAL_BIN"
      export PATH="$LOCAL_BIN:$PATH"
      if ! command -v docker-compose &> /dev/null; then
        printf '#!/bin/sh\nexec docker compose "$@"\n' > "$LOCAL_BIN/docker-compose"
        chmod +x "$LOCAL_BIN/docker-compose"
      fi
    # Fetch cache-manager
    - !reference [.fetch_cache_manager, before_script]
    # Create data directory
    - mkdir -p "${HAF_DATA_DIRECTORY}"
    # Extract sync cache
    - |
      echo -e "\e[0Ksection_start:$(date +%s):extract_cache[collapsed=true]\r\e[0KExtracting sync cache..."
      export SKIP_WAIT=true  # Don't wait for postgres yet
      ./scripts/ci-helpers/extract-cache-and-wait.sh "${HAFBE_SYNC_CACHE_TYPE}" "${HAFBE_CACHE_KEY}" "${HAF_DATA_DIRECTORY}"
      echo -e "\e[0Ksection_end:$(date +%s):extract_cache\r\e[0K"
    # Start docker-compose
    - |
      export PATH="$LOCAL_BIN:$PATH"
      export HIVED_UID="${HIVED_UID:-0}"
      echo "HIVED_UID=$HIVED_UID (container will run as this UID)"
      # Ensure container can write to extracted data (HAF runs as UID 4000 by default)
      sudo chmod -R 777 "${HAF_DATA_DIRECTORY}" || chmod -R 777 "${HAF_DATA_DIRECTORY}" || true
      echo -e "\e[0Ksection_start:$(date +%s):compose_up[collapsed=true]\r\e[0KStarting test environment..."
      docker-compose -f "${COMPOSE_FILE}" up -d
      echo -e "\e[0Ksection_end:$(date +%s):compose_up\r\e[0K"
    # Wait for services to be ready
    - |
      export PATH="$LOCAL_BIN:$PATH"
      echo -e "\e[0Ksection_start:$(date +%s):wait_services[collapsed=true]\r\e[0KWaiting for services..."
      ./scripts/ci-helpers/wait-for-postgrest.sh
      echo -e "\e[0Ksection_end:$(date +%s):wait_services\r\e[0K"
  after_script:
    - |
      export PATH="$LOCAL_BIN:$PATH"
      echo -e "\e[0Ksection_start:$(date +%s):compose_down[collapsed=true]\r\e[0KStopping test environment..."
      docker-compose -f "${COMPOSE_FILE:-docker/docker-compose-test.yml}" logs > docker/container-logs.txt 2>&1 || true
      docker-compose -f "${COMPOSE_FILE:-docker/docker-compose-test.yml}" down -v || true
      # Cleanup test data
      sudo rm -rf "${HAF_DATA_DIRECTORY:-/tmp/test-data}" || true
      echo -e "\e[0Ksection_end:$(date +%s):compose_down\r\e[0K"
  artifacts:
    paths:
      - docker/container-logs.txt
    when: always
    expire_in: 1 week
  tags:
    - data-cache-storage
    - fast

# =============================================================================
# TEST JOBS
# =============================================================================

regression-test:
  extends: .hafbe_test_base
  script:
    - |
      echo -e "\e[0Ksection_start:$(date +%s):tests\r\e[0KRunning regression tests..."

      cd tests/account_parameters
      ./accounts_dump_test.sh --host=${HAF_HOST}

      cd ../witness_parameters
      ./witnesses_dump_test.sh --host=${HAF_HOST}

      echo -e "\e[0Ksection_end:$(date +%s):tests\r\e[0K"
  artifacts:
    paths:
      - docker/container-logs.txt
      - tests/account_parameters/account_dump_test.log
      - tests/witness_parameters/witness_dump_test.log
    when: always

setup-scripts-test:
  extends: .hafbe_test_base
  script:
    - |
      echo -e "\e[0Ksection_start:$(date +%s):tests\r\e[0KRunning functional tests..."

      cd tests/functional
      ./test_scripts.sh --host=${HAF_HOST}

      echo -e "\e[0Ksection_end:$(date +%s):tests\r\e[0K"

performance-test:
  extends: .hafbe_test_base
  script:
    - |
      echo -e "\e[0Ksection_start:$(date +%s):tests\r\e[0KRunning performance tests..."

      timeout -k 1m 15m ./tests/run_performance_tests.sh --postgresql-host=${HAF_HOST} --postgrest-host=${POSTGREST_HOST} --database-size=6000 --test-loop-count=1000
      tar -cf - $(pwd)/tests/performance/result* | 7z a -si -mx9 tests/performance/results.tar.7z
      cat jmeter.log | python3 docker/ci/parse-jmeter-output.py
      m2u --input $(pwd)/tests/performance/result/result.xml --output $(pwd)/tests/performance/junit-result.xml

      echo -e "\e[0Ksection_end:$(date +%s):tests\r\e[0K"
  artifacts:
    paths:
      - docker/container-logs.txt
      - tests/performance/result/result_report/
      - tests/performance/results.tar.7z
      - jmeter.log
    when: always
    reports:
      junit: tests/performance/junit-result.xml

pattern-test:
  extends:
    - .hafbe_test_base
    - .pytest_based_template
  # Explicit image needed to override .pytest_based_template (which sets docker:latest)
  image: registry.gitlab.syncad.com/hive/common-ci-configuration/haf-app-test-runner:2.1
  variables:
    JUNIT_REPORT: $CI_PROJECT_DIR/tests/tavern/report.xml
    POETRY_INSTALL_ROOT_DIR: $CI_PROJECT_DIR/submodules/haf/hive/tests/python/hive-local-tools
    HAFBE_ADDRESS: ${POSTGREST_HOST}
    HAFBE_PORT: 3000
    TAVERN_DIR: $CI_PROJECT_DIR/tests/tavern
  before_script:
    - !reference [.hafbe_test_base, before_script]
    # Poetry is pre-installed in haf-app-test-runner image
    - !reference [.pytest_based_template, before_script]
  script:
    - |
      echo -e "\e[0Ksection_start:$(date +%s):warmup[collapsed=true]\r\e[0KWarming up database..."

      # Warmup: Run a complex query to warm PostgreSQL caches
      # This helps avoid statement timeouts on cold database (hafbe_user has 10s timeout)
      curl -s --max-time 15 -X POST "http://${POSTGREST_HOST}:3000/rpc/get_witness_votes_history" \
        -H "Content-Type: application/json" \
        -d '{"account-name":"blocktrades","page-size":5}' > /dev/null 2>&1 || true

      echo -e "\e[0Ksection_end:$(date +%s):warmup\r\e[0K"

      echo -e "\e[0Ksection_start:$(date +%s):tests\r\e[0KRunning Tavern API tests..."

      cd $CI_PROJECT_DIR/tests/tavern
      pytest -n $PYTEST_NUMBER_OF_PROCESSES --junitxml report.xml .

      echo -e "\e[0Ksection_end:$(date +%s):tests\r\e[0K"
  artifacts:
    paths:
      - docker/container-logs.txt
      - "**/*.out.json"
    when: always
    reports:
      junit: $CI_PROJECT_DIR/tests/tavern/report.xml

build_and_publish_image:
  stage: publish
  extends: .publish_docker_image_template
  before_script:
  - !reference [.publish_docker_image_template, before_script]
  script:
  - |
    scripts/ci-helpers/build_and_publish_instance.sh
    if [[ -n "$CI_COMMIT_TAG" ]]; then
      docker tag "$CI_REGISTRY_IMAGE/postgrest-rewriter:$CI_COMMIT_TAG" "registry-upload.hive.blog/haf_block_explorer/postgrest-rewriter:$CI_COMMIT_TAG"
      docker push "registry-upload.hive.blog/haf_block_explorer/postgrest-rewriter:$CI_COMMIT_TAG"
    fi
  tags:
  - public-runner-docker

deploy_python_api_packages_to_gitlab:
  stage: publish
  needs:
  - job: build_python_api_client_wheel
    artifacts: true
  - job: generate_python_api_client
    artifacts: true
  - job: python_api_client_test
  extends: .deploy_wheel_to_gitlab_template
  variables:
    PYPROJECT_DIR: "${CI_PROJECT_DIR}/scripts/python_api_package"
    # Job uses artifacts, doesn't need submodules
    GIT_SUBMODULE_STRATEGY: none
  when: on_success
  tags:
  - public-runner-docker

deploy-wax-spec-dev-package:
  extends: .npm_deploy_package_template
  stage: publish
  variables:
    # Use CI_PROJECT_DIR instead of PACKAGE_SOURCE_DIR which has runner-specific paths
    SOURCE_DIR: "${CI_PROJECT_DIR}/build/generated"
    NPM_PACKAGE_SCOPE: "@hiveio"
    # Job uses artifacts, doesn't need submodules
    GIT_SUBMODULE_STRATEGY: none
  before_script:
    # Replicate template's before_script setup
    - git config --global --add safe.directory '*'
    - . "${NVM_DIR}/nvm.sh"
    - nvm use "${NODEJS_VERSION}"
    # Fix PACKAGE_TGZ_PATH - dotenv has runner-specific path, need to find actual file
    - export PACKAGE_TGZ_PATH=$(ls ${CI_PROJECT_DIR}/build/*.tgz 2>/dev/null | head -1)
    - echo "Using PACKAGE_TGZ_PATH=$PACKAGE_TGZ_PATH"
  needs:
  - job: generate-wax-spec
    artifacts: true
  tags:
  - public-runner-docker

deploy-wax-spec-production-public-npm:
  extends: .registry_npmjs_org_deploy_package_template
  stage: publish
  variables:
    NPM_PUBLISH_TOKEN: "$INTERNAL_HIDDEN_PUBLISH_TOKEN"
    NPM_PACKAGE_NAME: "wax-api-hafbe"
    # Use CI_PROJECT_DIR instead of PACKAGE_SOURCE_DIR which has runner-specific paths
    SOURCE_DIR: "${CI_PROJECT_DIR}/build/generated"
    # Job uses artifacts, doesn't need submodules
    GIT_SUBMODULE_STRATEGY: none
  before_script:
    # Replicate template's before_script setup
    - git config --global --add safe.directory '*'
    - . "${NVM_DIR}/nvm.sh"
    - nvm use "${NODEJS_VERSION}"
    # Fix PACKAGE_TGZ_PATH - dotenv has runner-specific path, need to find actual file
    - export PACKAGE_TGZ_PATH=$(ls ${CI_PROJECT_DIR}/build/*.tgz 2>/dev/null | head -1)
    - echo "Using PACKAGE_TGZ_PATH=$PACKAGE_TGZ_PATH"
  needs:
  - job: generate-wax-spec
    artifacts: true
  tags:
  - public-runner-docker

cleanup_haf_cache_manual:
  extends: .cleanup_cache_manual_template
  stage: cleanup
  variables:
    CLEANUP_PATH_PATTERN: "${DATA_CACHE_HAF_PREFIX}_*"
  tags:
  - data-cache-storage
  - fast
